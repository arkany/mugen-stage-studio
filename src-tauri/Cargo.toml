[package]
name = "mugen-stage-studio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mugen_stage_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stage-core = { path = "stage-core" }
# Header-only dimension reads on import; full decode lands with the exporter.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# `stage-core` holds the geometry and template logic. It is a separate crate so
# `cargo test -p stage-core` runs the arithmetic without needing a working
# GTK/WebKit toolchain, and so the web validator can share it later.
[workspace]
members = ["stage-core"]

