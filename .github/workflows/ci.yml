name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The coordinate model, templates, DEF writer and SFF writer. stage-core
  # depends only on serde, so this needs no system packages and reports in
  # seconds — it carries the [BG] start / sprite axis invariant tests.
  core:
    name: Rust · stage-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: core
      - name: cargo test -p stage-core
        working-directory: src-tauri
        run: cargo test -p stage-core

  # Everything, including the image → SFF/DEF export round trip in
  # src/export.rs, which pulls in tauri and image and so needs GTK/WebKit.
  full:
    name: Rust · workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        # The update is load-bearing: without it apt 404s on stale indexes.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: full
      - name: Create frontendDist placeholder
        # dist/ is gitignored; tauri::generate_context! resolves frontendDist
        # at compile time, so make sure the path exists on a fresh checkout.
        run: mkdir -p dist
      - name: cargo test --workspace
        working-directory: src-tauri
        run: cargo test --workspace

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: npm run build
        run: npm run build
